# Local Postgres, Redis and an S3-compatible store (stands in for Cloudflare R2).
# Start with: docker compose up -d   then: npm run storage:setup
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SeaweedFS speaks the S3 API, so the app talks to it exactly as it talks to R2.
  # (MinIO no longer publishes images on Docker Hub.) Accepts any credentials locally.
  s3:
    image: chrislusf/seaweedfs:latest
    command: ['server', '-s3', '-dir=/data', '-master.volumeSizeLimitMB=1024']
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  s3data:
